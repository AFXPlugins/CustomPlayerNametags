# Command usage messages
# ----------------------------------------------------------------------------------------------------------------
usage-top-level:
  - "&cUsages:"
  - "&f/{label} reload &e- Reload plugin."
  - "&f/{label} update &e- Check plugin for updates."
  - "&f/{label} format &e- Manage nametag formats."

usage-format:
  - "&cUsages:"
  - "&f/{label} format view &6<&fglobal&6|&fplayer&6> &e- View nametag format."
  - "&f/{label} format set &6<&fglobal&6|&fplayer&6> &e- Set nametag format."
  - "&f/{label} format reset &6<&fglobal&6|&fplayer&6> &e- Reset nametag format."

usage-format-view:
  - "&cUsages:"
  - "&f/{label} format view global unparsed &e- View the unparsed global nametag format."
  - "&f/{label} format view global parsed &6<&fplayer&6> &e- View the global nametag format parsed for a player."
  - "&f/{label} format view player &6<&funparsed&6|&fparsed&6> &6<&fplayer&6> &e- View a player's nametag format."

usage-format-set:
  - "&cUsages:"
  - "&f/{label} format set global &6<&fformat&6> &e- Set the global nametag format."
  - "&f/{label} format set player &6<&fplayer&6> &6<&fformat&6> &e- Set a player's nametag format."
  - "&cUsages:"
  - "&f/{label} format reset global &e- Reset the global nametag format to default."
  - "&f/{label} format reset player &6<&fplayer&6> &e- Reset a player's nametag format."
