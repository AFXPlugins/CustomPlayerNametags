# Command usage messages
# ----------------------------------------------------------------------------------------------------------------
usage-top-level:
  - "&cUsages:"
  - "&f/{label} reload &e- Reload the plugin."
  - "&f/{label} update &e- Check for plugin updates."
  - "&f/{label} format &e- Manage nametag formats (global, player, and LuckPerms group)."
  - "&f/{label} editor &e- Open the nametag format editor."
  - "&f/{label} config &6[&fkey&6] &6[&fvalue&6] &e- View or change runtime-safe config.yml values."

usage-format:
  - "&cUsages:"
  - "&f/{label} format global &e- Manage the global nametag format."
  - "&f/{label} format player &e- Manage a player's individual nametag format."
  - "&f/{label} format groups &e- Manage LuckPerms group nametag formats."
  - "&7Run any of these without arguments for its full usage."

usage-format-global:
  - "&cUsages:"
  - "&f/{label} format global set &6[&fjava/bedrock&6] &6<&fformat&6> &e- Set the global format."
  - "&f/{label} format global reset &6[&fjava/bedrock&6] &e- Reset the global format to the default."
  - "&f/{label} format global view &6[&fjava/bedrock&6] &6[&fplayer&6] &e- View the global format, parsed for [player] if given."
  - "&6[&fjava/bedrock&6] &7is required only when &fenable-separate-bedrock-global-format &7is true."

usage-format-player:
  - "&cUsages:"
  - "&f/{label} format player set &6[&fannounce/silent&6] &6<&fplayer&6> &6<&fformat&6> &e- Set a player's format."
  - "&f/{label} format player disable &6<&fplayer&6> &e- Remove a player's individual format."
  - "&f/{label} format player view &6<&fplayer&6> &e- View a player's format."
  - "&6[&fannounce/silent&6] &7is accepted only when &fnametag-format-notify-mode &7is BOTH."

usage-format-set:
  - "&cUsages:"
  - "&f/{label} format set global &6<&fformat&6> &e- Set the global format."
  - "&f/{label} format set player &6[&fannounce/silent&6] &6<&fplayer&6> &6<&fformat&6> &e- Set a player's format."
  - "&6[&fannounce/silent&6] &7is accepted only when &fnametag-format-notify-mode &7is BOTH."

usage-format-groups:
  - "&cUsages:"
  - "&f/{label} format groups add &6[&fjava/bedrock&6] &6<&fgroup&6> &6<&fformat&6> &e- Create a group format (fails if one already exists)."
  - "&f/{label} format groups edit &6[&fjava/bedrock&6] &6<&fgroup&6> &6<&fformat&6> &e- Change a group format (fails if none exists yet)."
  - "&f/{label} format groups remove &6[&fjava/bedrock&6] &6<&fgroup&6> &e- Remove a group format."
  - "&f/{label} format groups view &6[&fjava/bedrock&6] &6<&fgroup&6> &6[&fplayer&6] &e- View a group format, parsed for [player] if given."
  - "&6[&fjava/bedrock&6] &7is required only when &fenable-separate-bedrock-group-formats &7is true."

