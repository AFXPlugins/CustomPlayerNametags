# Command usage messages
# ----------------------------------------------------------------------------------------------------------------
usage-top-level:
  - "&cUsages:"
  - "&f/{label} reload &e- Reload plugin."
  - "&f/{label} update &e- Check plugin for updates."
  - "&f/{label} format &e- Manage nametag formats (including LuckPerms group formats)."
  - "&f/{label} editor &e- Open the nametag format editor."
  - "&f/{label} config &e- View/change safely-runtime-changeable config.yml values."

usage-format:
  - "&cUsages:"
  - "&f/{label} format global set &6[&fjava/bedrock&6] &6<&fformat&6>|reset &6[&fjava/bedrock&6]|view &6[&fjava/bedrock&6] &6[&fplayer&6] &e- Manage the global format. &6[&fjava/bedrock&6] only applies when enable-separate-bedrock-global-format is true."
  - "&f/{label} format player set &6<&fplayer&6> &6[&fannounce/silent&6] &6<&fformat&6>|disable &6<&fplayer&6>|view &6<&fplayer&6> &e- Manage a player's format. &6[&fannounce/silent&6] only applies when nametag-format-notify-mode is BOTH."
  - "&f/{label} format groups add &6[&fjava/bedrock&6] &6<&fgroup&6> &6<&fformat&6>|edit &6[&fjava/bedrock&6] &6<&fgroup&6> &6<&fformat&6>|remove &6[&fjava/bedrock&6] &6<&fgroup&6>|view &6[&fjava/bedrock&6] &6<&fgroup&6> &6[&fplayer&6] &e- Manage group formats. &6[&fjava/bedrock&6] only applies when enable-separate-bedrock-group-formats is true."

usage-format-set:
  - "&cUsages:"
  - "&f/{label} format set global &6<&fformat&6> &e- Set the global nametag format."
  - "&f/{label} format set player &6<&fplayer&6> &6<&fformat&6> &e- Set a player's nametag format."

usage-format-groups:
  - "&cUsages:"
  - "&f/{label} format groups add &6[&fjava/bedrock&6] &6<&fgroup&6> &6<&fformat&6> &e- Create a new group's nametag format. Fails if the group already has one."
  - "&f/{label} format groups edit &6[&fjava/bedrock&6] &6<&fgroup&6> &6<&fformat&6> &e- Update an existing group's nametag format. Fails if the group doesn't have one yet."
  - "&f/{label} format groups remove &6[&fjava/bedrock&6] &6<&fgroup&6> &e- Remove a group's nametag format."
  - "&f/{label} format groups view &6[&fjava/bedrock&6] &6<&fgroup&6> &6[&fplayer&6] &e- View a group's format, unparsed and parsed."

