# Reload command: /nametags reload

# Text shown above each player's head. Supports PlaceholderAPI and '&' colors.
# Default: %player_name% (player's username)
# Example: "%luckperms_prefix%%essentials_nickname%" (Requires LuckPerms, EssentialsX, and their respective PlaceholderAPI expansions)
#
# PlaceholderAPI documentation:
# https://wiki.placeholderapi.com/users/using-placeholders/
nametag-format: "%player_name%"

# Height (in blocks) the nametag floats above the player.
# Default: 2.2
nametag-height-offset: 2.2

# PLEASE DO NOT CHANGE THIS VALUE!
plugin-version: 1