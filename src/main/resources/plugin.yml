name: CustomPlayerNametags
version: '1.0.0'
main: afx.customplayernametags.CustomPlayerNametags
api-version: '26.2'
author: AFXPlugins
description: >
  Fully customizable player nametags.

depend: [packetevents]
softdepend: [PlaceholderAPI]

commands:
  nametags:
    description: CustomPlayerNametags commands
    usage: /nametags reload | /nametags update | /nametags dismount <player> [ticks] (console only) | /nametags format view <unparsed|parsed> <player> | /nametags format set <player> "<format>" | /nametags format reset <player>
    aliases: [customplayernametags]
    permission: customplayernametags.admin
    permission-message: You do not have permission to use this command.

permissions:
  customplayernametags.admin:
    description: Allows use of all CustomPlayerNametags commands.
    default: op
