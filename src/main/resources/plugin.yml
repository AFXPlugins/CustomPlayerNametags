name: CustomPlayerNametags
version: '1.0.0'
main: afx.customplayernametags.CustomPlayerNametags
api-version: '26.2'
author: AFXPlugins
description: >
  Customizable overhead nametags for every player.

depend: [packetevents, PlaceholderAPI]
softdepend: [LuckPerms, Essentials]

commands:
  nametags:
    description: Manage the CustomPlayerNametags plugin.
    usage: /nametags reload | /nametags dismount <player> [ticks] (console only) | /nametags format view <unparsed|parsed> <player> | /nametags format set <player> "<format>" | /nametags format reset <player>
    aliases: [customplayernametags]
    permission: nametag.admin
    permission-message: You do not have permission to use this command.

permissions:
  nametag.admin:
    description: Allows use of /nametags reload (or /customplayernametags reload) and other admin actions.
    default: op
