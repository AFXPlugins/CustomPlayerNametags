  java:
    slot: 11
    material: GRASS_BLOCK
    name: "&aJava"
    lore: ["&7Edit the normal (Java Edition) global format"]
  bedrock:
    slot: 15
    material: NETHERITE_BOOTS
    name: "&bBedrock"
    lore: ["&7Edit the separate Bedrock global format"]
  back:
    slot: 22
    material: OAK_DOOR
    name: "&eBack"
    lore: []

# Shown before opening the group list only when
# enable-separate-bedrock-group-formats is true in config.yml. Whichever is
