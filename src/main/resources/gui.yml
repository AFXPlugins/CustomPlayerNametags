# Opened from Add Item's Widget button when creating a brand-new widget, or
# from widget-contents-menu's "Edit Permissions" button when re-configuring an
# existing one — lets the admin choose which item types (and character limit)
# the player will be allowed to put into the slot. The name of each toggle
# button is shown stripped of its own color and re-colored green/yellow-vs-gray
# at render time depending on whether it's currently on or off, so only the
# material/slot/base text here are actually admin-configurable. The "Add"
# button's own label switches to "Save Changes" at render time when editing an
# existing widget's permissions instead of creating a new one.
widget-toggles-menu:
  title: "&8Widget: Allowed Items"
  colors:
    slot: 10
    material: RED_WOOL
    name: "&cAllow Colors"
    lore: ["&7Whether colors/styles can be added to this widget"]
  placeholders:
    slot: 12
    material: NAME_TAG
    name: "&bAllow Placeholders"
    lore: ["&7Whether placeholders can be added to this widget"]
  text:
    slot: 14
    material: OAK_SIGN
    name: "&fAllow Text"
    lore: ["&7Whether text can be added to this widget"]
  # Not a toggle — clicking opens the sign editor to type a new limit, or leave it blank
  # for unlimited. Current value is appended to this lore at render time.
  character-limit:
    slot: 16
    material: PAPER
    name: "&eCharacter Limit"
    lore: ["&7Maximum characters allowed in a Text item added to this widget"]
  add:
    slot: 22
    material: EMERALD
    name: "&aAdd"
    lore: ["&7Add this widget to the format"]
  back:
    slot: 26
    material: OAK_DOOR
    name: "&eBack"
    lore: []

# Opened when a player or admin clicks an existing Widget item in the
# editor grid — shows what's currently inside it.
widget-contents-menu:
  title: "&8Widget Contents"
  add-item:
    slot: 13
    material: HOPPER
    name: "&aAdd Item"
    lore: ["&7Add an item to this widget"]
  # The following 2 are only shown to an admin editing a Global/Player/Group
  # template — a player can empty a widget by removing its contents one at a
  # time but can never change its permissions or remove the slot itself.
  edit-permissions:
    slot: 11
    material: COMPARATOR
    name: "&eEdit Permissions"
    lore: ["&7Change what item types are allowed here"]
  delete-widget:
    slot: 15
    material: BARRIER
    name: "&cDelete Widget"
    lore: ["&7Remove this widget entirely"]
  back:
    slot: 22
    material: OAK_DOOR
    name: "&eBack"
    lore: []

# Opened when clicking an individual item inside a widget's contents — same
# shape as detail-menu, scoped to just that widget's slot.
widget-item-detail-menu:
  title: "&8Edit Widget Item"
  move-left:
    slot: 11
    material: ARROW
    name: "&eMove left"
    lore: []
  delete:
    slot: 13
    material: BARRIER
    name: "&cDelete"
    lore: []
  move-right:
    slot: 15
    material: ARROW
    name: "&eMove right"
    lore: []
  # Only shown when the selected item is a Text chunk — Color/Placeholder items are picked from a
  # fixed list, so changing one is just deleting it and adding another.
  edit:
    slot: 17
    material: WRITABLE_BOOK
    name: "&eEdit"
    lore: ["&7Change this item's text"]
  back:
    slot: 22
    material: OAK_DOOR
    name: "&aBack"
    lore: []

# Opened by widget-contents-menu's "Add Item" button — only offers the
# item types the admin actually allowed for that widget.
widget-add-item-menu:
  title: "&8Add Widget Item"
  color:
    slot: 11
    material: RED_WOOL
    name: "&cColor"
    lore: ["&7Add a color/style"]
  color-disabled:
    slot: 11
    material: BARRIER
    name: "&cColors Disabled"
    lore: ["&7This widget does not allow colors/styles"]
  placeholder:
    slot: 13
    material: NAME_TAG
    name: "&bPlaceholder"
    lore: ["&7Add a saved placeholder"]
  placeholder-disabled:
    slot: 13
    material: BARRIER
    name: "&cPlaceholders Disabled"
    lore: ["&7This widget does not allow placeholders"]
  text:
    slot: 15
    material: OAK_SIGN
    name: "&fText"
    lore: ["&7Add text via sign GUI"]
  text-disabled:
    slot: 15
    material: BARRIER
    name: "&cText Disabled"
    lore: ["&7This widget does not allow text"]
  back:
    slot: 22
    material: OAK_DOOR
    name: "&eBack"
    lore: []

# Opened when clicking an individual chunk in the editor grid. {kind} in the title is replaced with the chunk's kind (Text/Placeholder/Color/Newline).
detail-menu:
  title: "&8Edit {kind}"
  move-left:
    slot: 11
    material: ARROW
    name: "&eMove left"
    lore: ["&7Move earlier in the format"]
  # Shown for every piece EXCEPT a Widget. A Widget uses this same slot for
  # "edit" below instead, since a widget is deleted from inside its own
  # contents page (widget-contents-menu's "Delete Widget") rather than here.
  delete:
    slot: 13
    material: BARRIER
    name: "&cDelete"
    lore: ["&7Remove this piece"]
  # Only shown when the selected piece is a Widget — opens that widget's
  # contents page.
  edit:
    slot: 13
    material: ITEM_FRAME
    name: "&eEdit Contents"
    lore: ["&7View and edit this widget's contents"]
  move-right:
    slot: 15
    material: ARROW
    name: "&eMove right"
    lore: ["&7Move later in the format"]
  back:
    slot: 22
    material: OAK_DOOR
    name: "&aBack"
    lore: []

confirm-menu:
  title: "&8Confirm Delete"
  cancel:
    slot: 11
    material: REDSTONE_BLOCK
    name: "&cCancel"
    lore: []
  confirm:
    slot: 15
    material: EMERALD_BLOCK
    name: "&aConfirm"
    lore: ["&7This cannot be undone"]
