  title: "&8Groups: Platform"
  java:
    slot: 11
    material: GRASS_BLOCK
    name: "&aJava"
    lore: ["&7Browse Java Edition group formats"]
  bedrock:
    slot: 15
    material: NETHERITE_BOOTS
    name: "&bBedrock"
    lore: ["&7Browse Bedrock group formats"]
  back:
    slot: 22
    material: OAK_DOOR
    name: "&eBack"
    lore: []

