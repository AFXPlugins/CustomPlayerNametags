main-menu:
  title: "&8Nametag Menu"
  edit:
    slot: 11
    material: ANVIL
    name: "&bEdit Nametag"
    lore: ["&7Edit the nametag format currently applied to you"]
  view:
    slot: 13
    material: OAK_SIGN
    name: "&fView"
    lore: ["&7View current nametag format"]
  # Shown in place of each other depending on whether this player currently has nametags hidden.
  toggle-hidden:
    slot: 15
    material: RED_DYE
    name: "&cNametags Hidden"
    lore: ["&7Click to see other players' nametags"]
  toggle-visible:
    slot: 15
    material: LIME_DYE
    name: "&aNametags Visible"
    lore: ["&7Click to stop seeing other players' nametags"]
  close:
    slot: 22
    material: BARRIER
    name: "&cClose"
    lore: []

