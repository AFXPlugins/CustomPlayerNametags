name = "customplayernametags-editor-relay"
main = "worker.js"
compatibility_date = "2024-11-01"

# Set this to your GitHub Pages origin once you know it, e.g.
# "https://yourname.github.io". "*" works too — the relay only ever
# carries short-lived nametag config text, not secrets.
[vars]
ALLOWED_ORIGIN = "*"

# Create this namespace first with:
#   wrangler kv namespace create NAMETAG_SESSIONS
# then paste the id it prints below.
[[kv_namespaces]]
binding = "NAMETAG_SESSIONS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
